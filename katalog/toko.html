<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Katalog Toko</title>
<link rel="icon" type="image/png" href="../assets/brand/favicon.png">
<link rel="stylesheet" href="../assets/css/style.css?v=20261009073717">
<script>/* version check */(function(v,r){try{fetch(r+"assets/version.json?t="+Date.now(),{cache:"no-store"}).then(function(x){return x.json()}).then(function(j){if(j.v&&j.v!==v){var u=new URL(location.href);if(u.searchParams.get("_v")!==j.v){u.searchParams.set("_v",j.v);location.replace(u.href)}}}).catch(function(){})}catch(e){}})("20261009073717","../")</script>
</head>
<body data-root="../">
<main>
  <div class="page-head"><div><h1>Katalog</h1><p class="sub" id="count"></p></div><button type="button" class="btn" id="openAdd" hidden><span data-icon="plus"></span>Tambah toko</button></div>
  <nav class="tabs subtabs" aria-label="Katalog"><a href="produk.html" class="">Produk</a><a href="toko.html" class="on">Toko</a></nav>
  <section><div class="table-wrap"><table id="table"></table></div></section>
  <dialog class="modal" id="dlg" aria-labelledby="formTitle">
    <form id="form" autocomplete="off">
      <div class="modal-head"><h3 id="formTitle">Tambah toko</h3><button type="button" class="icon-btn" data-close aria-label="Tutup" data-icon="x"></button></div>
      <div class="modal-body">
        <input type="hidden" name="id">
        <div class="field"><label for="s-name">Nama toko</label><input class="input" id="s-name" name="name" placeholder="mis. Toko Kemang" required></div>
        <div class="form-grid">
          <div class="field"><label for="s-chain">Jenis / jaringan</label><input class="input" id="s-chain" name="chain" list="chains" placeholder="mis. Supermarket"></div>
          <div class="field"><label for="s-city">Kota</label><input class="input" id="s-city" name="city" list="cities" required></div>
        </div>
        <div class="field"><label for="s-address">Alamat</label><input class="input" id="s-address" name="address"></div>
        <p><label class="check"><input type="checkbox" name="active" checked> Aktif (bisa dipilih SPG)</label></p>
        <datalist id="chains"></datalist><datalist id="cities"></datalist>
      </div>
      <div class="modal-foot"><button type="button" class="btn ghost" data-close>Batal</button><button class="btn" type="submit">Simpan</button></div>
    </form>
  </dialog>
</main>
<script src="../assets/js/config.js?v=20261009073717"></script>
<script src="../assets/js/data.js?v=20261009073717"></script>
<script src="../assets/js/common.js?v=20261009073717"></script>
<script src="../assets/js/pages/katalog-toko.js?v=20261009073717"></script>
</body>
</html>
