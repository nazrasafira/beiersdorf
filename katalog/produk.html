<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Katalog Produk</title>
<link rel="icon" type="image/png" href="../assets/brand/favicon.png">
<link rel="stylesheet" href="../assets/css/style.css?v=20261023053958">
<script>/* version check */(function(v,r){try{fetch(r+"assets/version.json?t="+Date.now(),{cache:"no-store"}).then(function(x){return x.json()}).then(function(j){if(j.v&&j.v!==v){var u=new URL(location.href);if(u.searchParams.get("_v")!==j.v){u.searchParams.set("_v",j.v);location.replace(u.href)}}}).catch(function(){})}catch(e){}})("20261023053958","../")</script>
</head>
<body data-root="../">
<main>
  <div class="page-head"><div><h1>Katalog</h1><p class="sub" id="count"></p></div><button type="button" class="btn" id="openAdd" hidden><span data-icon="plus"></span>Tambah produk</button></div>
  <nav class="tabs subtabs" aria-label="Katalog"><a href="produk.html" class="on">Produk</a><a href="toko.html" class="">Toko</a></nav>
  <section class="flat">
    <label class="tt-search shop-search"><span data-icon="search"></span><input type="search" class="input" id="q" placeholder="Cari nama, SKU, barcode..." aria-label="Cari produk" autocomplete="off"></label>
    <div class="shop-filters">
      <div class="field shop-filter" id="brandWrap"><label for="brand">Subbrand</label><select id="brand"></select></div>
      <nav class="tabs shop-status" id="statusTabs" aria-label="Status"><button type="button" data-status="active" class="on">Aktif</button><button type="button" data-status="inactive">Nonaktif</button><button type="button" data-status="all">Semua</button></nav>
    </div>
    <p class="small muted" id="shown"></p>
    <div class="shop-grid" id="grid"></div>
    <p class="empty center" id="none" hidden>Tidak ada produk yang cocok.</p>
    <nav class="shop-pager" id="pager" aria-label="Halaman"></nav>
  </section>
  <dialog class="modal" id="dlg" aria-labelledby="formTitle">
    <form id="form" autocomplete="off">
      <div class="modal-head"><h3 id="formTitle">Tambah produk</h3><button type="button" class="icon-btn" data-close aria-label="Tutup" data-icon="x"></button></div>
      <div class="modal-body">
        <input type="hidden" name="id">
        <div class="actions" style="margin-bottom:16px">
          <span id="imgPreview"></span>
          <button type="button" class="btn ghost small" id="pickImg">Pilih foto</button>
        </div>
        <div class="field"><label for="p-name">Nama</label><input class="input" id="p-name" name="name" required></div>
        <div class="form-grid">
          <div class="field"><label for="p-sku">SKU</label><input class="input" id="p-sku" name="sku"></div>
          <div class="field"><label for="p-price">Harga (Rp)</label><input class="input" id="p-price" name="price" type="text" inputmode="numeric" autocomplete="off" required></div>
          <div class="field"><label for="p-brand">Subbrand</label><input class="input" id="p-brand" name="brand" list="brands" placeholder="NIVEA BODY"><datalist id="brands"></datalist></div>
          <div class="field"><label for="p-barcode">Barcode</label><input class="input" id="p-barcode" name="barcode" inputmode="numeric"></div>
        </div>
        <p><label class="check"><input type="checkbox" name="active" checked> Aktif</label></p>
        <p class="note" id="byline" hidden></p>
      </div>
      <div class="modal-foot"><button type="button" class="btn ghost" data-close id="cancelBtn">Batal</button><button class="btn" type="submit" id="saveBtn">Simpan</button></div>
    </form>
  </dialog>
</main>
<script src="../assets/js/config.js?v=20261023053958"></script>
<script src="../assets/js/data.js?v=20261023053958"></script>
<script src="../assets/js/common.js?v=20261023053958"></script>
<script src="../assets/js/pages/katalog-produk.js?v=20261023053958"></script>
</body>
</html>
