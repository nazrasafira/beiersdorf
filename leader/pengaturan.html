<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Pengaturan</title>
<link rel="icon" type="image/png" href="../assets/brand/favicon.png">
<link rel="stylesheet" href="../assets/css/style.css?v=20261009073717">
<script>/* version check */(function(v,r){try{fetch(r+"assets/version.json?t="+Date.now(),{cache:"no-store"}).then(function(x){return x.json()}).then(function(j){if(j.v&&j.v!==v){var u=new URL(location.href);if(u.searchParams.get("_v")!==j.v){u.searchParams.set("_v",j.v);location.replace(u.href)}}}).catch(function(){})}catch(e){}})("20261009073717","../")</script>
</head>
<body data-root="../">
<main>
  <div class="page-head"><div><h1>Pengaturan</h1><p class="sub" id="sub"></p></div><button type="button" class="btn" id="save">Simpan</button></div>
  <section>
    <h2>Hari kerja</h2>
    <div class="chips" id="days"></div>
    <p class="note" id="dayCount"></p>
  </section>
  <section>
    <h2>Laporan</h2>
    <div class="form-grid">
      <div class="field"><label for="editDays">Batas ubah laporan (hari)</label><input class="input" type="number" id="editDays" min="0" max="14" step="1"></div>
      <div class="field"><label for="reminder">Jam pengingat</label><input class="input" type="time" id="reminder"></div>
    </div>
  </section>
  <section>
    <div class="actions" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">Hari libur</h2><button type="button" class="btn ghost small" id="openAdd"><span data-icon="plus"></span>Tambah hari libur</button></div>
    <div class="table-wrap"><table id="holidays"></table></div>
  </section>
  <dialog class="modal" id="dlg" aria-labelledby="dlgTitle">
    <form id="hForm" autocomplete="off">
      <div class="modal-head"><h3 id="dlgTitle">Tambah hari libur</h3><button type="button" class="icon-btn" data-close aria-label="Tutup" data-icon="x"></button></div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="field"><label for="hDate">Tanggal</label><input class="input" type="date" id="hDate" required></div>
          <div class="field"><label for="hName">Keterangan</label><input class="input" id="hName" required></div>
        </div>
        <p><label class="check"><input type="checkbox" id="hWork"> Tetap hari kerja (toko buka)</label></p>
      </div>
      <div class="modal-foot"><button type="button" class="btn ghost" data-close>Batal</button><button class="btn" type="submit" id="addHoliday">Tambah</button></div>
    </form>
  </dialog>
</main>
<script src="../assets/js/config.js?v=20261009073717"></script>
<script src="../assets/js/data.js?v=20261009073717"></script>
<script src="../assets/js/common.js?v=20261009073717"></script>
<script src="../assets/js/pages/leader-pengaturan.js?v=20261009073717"></script>
</body>
</html>
