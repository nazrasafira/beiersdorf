<body data-root="../">
<main>
  <div class="page-head">
    <div><h1>Target</h1><p class="sub" id="sub"></p></div>
    <div class="actions"><button type="button" class="btn ghost small" id="prev" aria-label="Bulan sebelumnya"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button><b id="month"></b><button type="button" class="btn ghost small" id="next" aria-label="Bulan berikutnya"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button></div>
  </div>
<section>
  <h2>Per SPG</h2>
  <div class="rows" id="spgRows"></div>
  <p class="note">Target SPG adalah jumlah target toko yang dipegangnya.</p>
</section>
<section>
  <div class="tgt-head">
    <h2>Target per toko</h2>
    <div class="actions">
      <button type="button" class="link" id="copyPrev">Salin bulan lalu</button>
      <button type="button" class="link" id="applyAll">Samakan semua</button>
    </div>
  </div>
  <label class="tt-search tgt-search"><span data-icon="search"></span><input type="search" class="input" id="search" placeholder="Cari toko atau SPG..." aria-label="Cari toko atau SPG" autocomplete="off"></label>
  <div class="tgt-list" id="rows"></div>
  <p class="empty" id="none" hidden>Tidak ditemukan</p>
  <details class="tgt-taken" id="takenWrap" hidden>
    <summary id="takenSum"></summary>
    <div class="rows" id="taken"></div>
  </details>
  <p class="note">Satu toko dipegang satu SPG; satu SPG boleh memegang beberapa toko. Mingguan dan harian dihitung otomatis. Isi hanya jika ingin diubah manual.</p>
</section>
<div class="save-bar"><span class="small muted" id="dirty"></span><button type="button" class="btn" id="save">Simpan</button></div>
