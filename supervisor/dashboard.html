<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Dashboard Area</title>
<link rel="icon" type="image/png" href="../assets/brand/favicon.png">
<link rel="stylesheet" href="../assets/css/style.css?v=20261009073717">

<main>
  <div class="page-head">
    <div><h1 id="title"></h1><p class="sub" id="sub"></p></div>

      <button type="button" data-p="week">Minggu ini</button>
      <button type="button" data-p="month" class="on">Bulan ini</button>

  <section class="flat">
    <h2>SPG terbaik area</h2>
    <div class="podium" id="podium"></div>
  </section>
  <section>
    <h2>Peringkat tim</h2>
    <div class="table-wrap"><table id="teams"></table></div>
  </section>
</main>
