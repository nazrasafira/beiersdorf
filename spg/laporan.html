<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Penjualan · Laporan SPG</title>
<link rel="icon" type="image/png" href="../assets/brand/favicon.png">
<link rel="stylesheet" href="../assets/css/style.css?v=20261008073012">
<script>/* version check */(function(v,r){try{fetch(r+"assets/version.json?t="+Date.now(),{cache:"no-store"}).then(function(x){return x.json()}).then(function(j){if(j.v&&j.v!==v){var u=new URL(location.href);if(u.searchParams.get("_v")!==j.v){u.searchParams.set("_v",j.v);location.replace(u.href)}}}).catch(function(){})}catch(e){}})("20261008073012","../")</script>
</head>
<body data-root="../">
<main>
  <div class="page-head">
    <div><h1>Penjualan</h1><p class="sub" id="sub"></p></div>
    <a href="laporan.html" id="back" class="icon-btn" aria-label="Ke hari ini" data-icon="calendar" hidden></a>
  </div>

  <section id="startWrap" class="center" hidden>
    <p class="muted">Mulai shift untuk mencatat penjualan.</p>
    <button type="button" class="btn block" id="startShift">Mulai shift</button>
  </section>

  <p class="muted small" id="shift" hidden></p>
  <div class="store-bar" id="storeBar" hidden>
    <span class="store-now"><span data-icon="store"></span><b id="storeName"></b></span>
    <button type="button" class="btn ghost small" id="switchStore">Ganti toko</button>
  </div>
  <p class="notice" id="locked" hidden></p>

  <form id="entry" class="entry" autocomplete="off" hidden>
    <p class="note" id="late" hidden style="margin:0 0 12px">Tambah penjualan yang terlewat.</p>
    <div class="field"><label for="product">Produk</label><select id="product" data-placeholder="Cari produk..."></select></div>
    <div id="preview" class="center" hidden style="margin:-4px 0 12px"></div>
    <div class="entry-row">
      <div class="field">
        <label for="qty">Qty</label>
        <div class="stepper">
          <button type="button" id="minus" aria-label="Kurangi" data-icon="minus"></button>
          <input class="input" id="qty" type="number" inputmode="numeric" min="1" step="1" value="1">
          <button type="button" id="plus" aria-label="Tambah" data-icon="plus"></button>
        </div>
      </div>
      <div class="field"><label for="price">Harga satuan</label><input class="input" id="price" type="number" inputmode="numeric" min="0" step="500"></div>
    </div>
    <div class="entry-foot"><span class="muted">Subtotal <b id="subtotal">Rp 0</b></span><button class="btn" type="submit">Simpan</button></div>
  </form>

  <section>
    <div class="actions" style="justify-content:space-between;margin-bottom:8px">
      <h2 style="margin:0">Hari ini</h2>
      <span><b id="total">Rp 0</b> <span class="muted small" id="count"></span></span>
    </div>
    <div class="rows wrap" id="list"></div>
  </section>

  <section id="notes" hidden>
    <h2>Foto catatan</h2>
    <div id="notePhotos"></div>
  </section>

  <button type="button" class="btn ghost block" id="endShift" hidden>Akhiri shift</button>

  <dialog class="modal" id="endDlg" aria-labelledby="endTitle">
    <form id="endForm">
      <div class="modal-head"><h3 id="endTitle">Akhiri shift</h3><button type="button" class="icon-btn" data-close aria-label="Tutup" data-icon="x"></button></div>
      <div class="modal-body">
        <p class="note" style="margin:0 0 12px">Foto catatan penjualan hari ini <b>(wajib)</b>. Satu foto per halaman, pastikan tulisannya terbaca.</p>
        <div class="note-photos" id="endPhotos"></div>
        <button type="button" class="btn ghost block" id="addPhoto"><span data-icon="camera"></span><span id="addPhotoLabel">Ambil foto catatan</span></button>
      </div>
      <div class="modal-foot"><button type="button" class="btn ghost" data-close>Batal</button><button class="btn" type="submit" id="endSubmit" disabled>Akhiri shift</button></div>
    </form>
  </dialog>
</main>
<script src="../assets/js/config.js?v=20261008073012"></script>
<script src="../assets/js/data.js?v=20261008073012"></script>
<script src="../assets/js/common.js?v=20261008073012"></script>
<script src="../assets/js/pages/spg-laporan.js?v=20261008073012"></script>
</body>
</html>
